name: Publish Packages

on:
  push:
    branches: [main]
    paths:
      - 'migrator/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: read
      id-token: write # Required only for this guarded npm publish job
    if: ${{ github.repository == 'roostorg/coop' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Check and publish migrator
        run: |
          cd migrator
          VERSION=$(node -p "require('./package.json').version")
          echo "Checking @roostorg/db-migrator@$VERSION..."

          if npm view "@roostorg/db-migrator@$VERSION" version >/dev/null 2>&1; then
            echo "⚠️  Version $VERSION of @roostorg/db-migrator already exists on npm - skipping"
          else
            echo "✅ Publishing @roostorg/db-migrator@$VERSION..."
            npm ci
            npm run build
            npm publish
          fi
